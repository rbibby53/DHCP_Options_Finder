[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dhcp-options-finder"
version = "0.3.0"
description = "Query DHCP servers and decode every option they hand out. Cross-platform GUI + CLI."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Ryan J. Bibby" }]
dependencies = ["psutil>=7.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/rbibby53/DHCP_Options_Finder"
Releases = "https://github.com/rbibby53/DHCP_Options_Finder/releases"
Issues = "https://github.com/rbibby53/DHCP_Options_Finder/issues"

[project.scripts]
dhcpprobe = "dhcp_options_finder.cli:main"

[project.gui-scripts]
dhcp-options-finder = "dhcp_options_finder.gui:main"

[tool.setuptools]
packages = ["dhcp_options_finder"]

[tool.setuptools.package-data]
dhcp_options_finder = ["assets/*.png"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108", "UP032", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["dhcp_options_finder", "fakeserver", "fakeserver6", "test_features"]

[tool.pytest.ini_options]
testpaths = ["tests"]
