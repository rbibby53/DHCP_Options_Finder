name: Bug report
description: Something didn't work or decoded wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Output with **Show raw hex** (or `-x`) on makes decoding bugs much easier to fix.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS (Apple silicon), Linux]
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options: [Release app (GUI), Release CLI, From source]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Discover, Inform]
  - type: input
    id: server
    attributes:
      label: DHCP server platform
      placeholder: e.g. Windows Server 2022, Infoblox, Kea, ISC dhcpd, Cisco IOS, UniFi
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / error (with raw hex if relevant)
      description: Redact anything sensitive (IPs, hostnames, MACs).
      render: text
