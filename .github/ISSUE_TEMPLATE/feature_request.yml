name: Feature request
description: A new decoder, option, platform or workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: For a new option decoder, include the option code, the RFC or vendor doc, and a sample raw hex value if you have one.
