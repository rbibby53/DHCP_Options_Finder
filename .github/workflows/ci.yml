name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -v tests
      - name: CLI smoke test
        run: |
          python dhcpprobe.py --version
          python dhcpprobe.py --list
      - name: GUI module imports
        run: python -c "import dhcpprobe_gui"

      # Real UDP/68 sockets against a fake server on loopback.
      - name: Loopback integration (Linux/macOS)
        if: runner.os != 'Windows'
        run: sudo -E DHCPPROBE_LOOPBACK=1 "$(which python)" -m pytest -v tests/test_loopback.py
      - name: Loopback integration (Windows)
        if: runner.os == 'Windows'
        env:
          DHCPPROBE_LOOPBACK: "1"
        run: python -m pytest -v tests/test_loopback.py
